<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Welcome to Corah</title>
        <!-- Step 1 Add a link to your stylesheet under head -->
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <!-- Step 2 Use semantic elements to set up the sections -->
        <header class="header-container">
            <div class="header-inner-container">
                <!-- Step 3 Setup Logo Area -->
                <div class="logo-container">
                    <img class="logo-brand" src="icons/corah-brand-logo.svg" alt="Corah Thumbprint Logo">
                    <img class="logo-wordmark" src="icons/corah-brand-wordmark-dark.svg" alt="Corah Thumbprint Logo">
                </div>
                <!-- Step 4 Setup Nav Area -->
                <nav class="nav-container">
                    <button class="nav-button" type="button">home</button>
                    <button class="nav-button" type="button">about</button>
                    <button class="nav-button" type="button">events</button>
                    <button class="nav-button" type="button">register</button>
                    <button class="nav-button" type="button">log-in</button>
                </nav>
            </div>
        </header>
        <main></main>
        <footer></footer>
    </body>
</html>
